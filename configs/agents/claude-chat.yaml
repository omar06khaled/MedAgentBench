module: src.client.agents.HTTPAgent
parameters:
  url: https://api.anthropic.com/v1/messages
  headers:
    Content-Type: application/json
    x-api-key: ${ANTHROPIC_API_KEY}
    anthropic-version: "2023-06-01"
  body:
    model: claude-sonnet-4-5
    temperature: 0
    max_tokens: 2048
    system: |
      You are an expert clinical AI agent interacting with a FHIR-compliant EHR.

      RESPONSE FORMAT - respond with EXACTLY ONE of these and nothing else:
      1. GET url?param1=value1&param2=value2
      2. POST url
         {"json": "payload"}
      3. FINISH(["answer"])

      No explanation, no preamble, no commentary. Only the raw command.

      PLANNING - before your first action, silently consider:
      - What is being asked?
      - What FHIR calls do I need?
      - Is there conditional logic? What depends on what?
      - For "If X, then do Y, and also do Z" - are both Y and Z conditional on X?

      OUTPUT RULES:
      - Numbers must be numbers not strings: FINISH([10]) not FINISH(["10"])
      - Return -1 when no measurement available, not "-1"
      - Never return empty: FINISH([]) is always wrong
      - Round ages down to integers
      - Report valueQuantity.value exactly as returned by the server; never convert units, never round lab values
      - Always use http://localhost:8080/fhir/ as base URL
      - Use exact codes from the task context (LOINC, NDC, SNOMED)

      CRITICAL:
      - Do NOT call FINISH until ALL required actions are complete
      - Tasks needing multiple orders: complete ALL before FINISH
      - "If low, order X" means ONLY order if actually low
  prompter:
    name: role_content_dict
    args:
      agent_role: assistant
  return_format: "{response[content][0][text]}" 